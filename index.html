
<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Všechno nejlepší, brácha!</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>

  <!-- Úvodní animace -->
  <section id="celebration">
    <canvas id="fireworks"></canvas>

    <div class="intro-text">
      <span>✨</span>
      <p>Dneska je tvůj den!</p>
      <span>✨</span>
    </div>

    <div class="sparkler sparkler-left">✦</div>
    <div class="sparkler sparkler-right">✦</div>
  </section>

  <!-- Narozeninové přání -->
  <section id="greeting">
    <div class="greeting-content">
      <div class="decoration">✦ ✧ ✦</div>

      <h1>Všechno nejlepší,<br>brácha!</h1>

      <div class="gold-line"></div>

      <h2>K tvým <span>22.</span> narozeninám</h2>

      <div class="cake">🎂</div>

      <p class="wish">
        Ať se ti splní všechno, co si přeješ!
      </p>

      <button id="replay" onclick="restartAnimation()">
        ↻ Přehrát znovu
      </button>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
